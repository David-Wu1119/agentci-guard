name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # Fails on advisories at or above high. Retries only when the advisory
        # endpoint itself is unreachable, and still fails after the window.
        run: node scripts/audit-dependencies.mjs --level high

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # Enforces the coverage floor declared in vitest.config.ts.
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Verify browser scanner parity
        run: pnpm site:check

      - name: Verify site interactions in Chrome
        timeout-minutes: 5
        run: |
          set -euo pipefail
          google-chrome --headless=new --no-sandbox \
            --remote-debugging-port=9337 \
            --user-data-dir="$RUNNER_TEMP/agentci-site-chrome" about:blank \
            >"$RUNNER_TEMP/agentci-site-chrome.log" 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT
          for ((attempt = 0; attempt < 50; attempt++)); do
            if curl --fail --silent http://127.0.0.1:9337/json/version >/dev/null; then
              node site/render-check.mjs
              exit 0
            fi
            sleep 0.2
          done
          sed -n '1,120p' "$RUNNER_TEMP/agentci-site-chrome.log"
          exit 1

      - name: Verify committed Action bundle
        run: |
          git diff --exit-code -- dist
          node scripts/verify-action-manifest.mjs

      - name: Action smoke - vulnerable, non-blocking
        id: vulnerable
        uses: ./
        with:
          path: examples/vulnerable
          sarif: artifacts/vulnerable.sarif
          json: artifacts/vulnerable.json
          fail-on: none

      - name: Verify vulnerable Action outputs
        env:
          EXPECT_FINDINGS: ${{ steps.vulnerable.outputs.findings }}
          EXPECT_CRITICAL: ${{ steps.vulnerable.outputs.critical }}
          EXPECT_HIGH: ${{ steps.vulnerable.outputs.high }}
          EXPECT_MEDIUM: ${{ steps.vulnerable.outputs.medium }}
          EXPECT_LOW: ${{ steps.vulnerable.outputs.low }}
          OUTPUT_SARIF_PATH: ${{ steps.vulnerable.outputs.sarif-path }}
          OUTPUT_JSON_PATH: ${{ steps.vulnerable.outputs.json-path }}
          ANALYSIS_COMPLETE: ${{ steps.vulnerable.outputs.analysis-complete }}
          EXPECT_DIAGNOSTICS: ${{ steps.vulnerable.outputs.diagnostics }}
        run: |
          node scripts/verify-sarif-schema.mjs artifacts/vulnerable.sarif
          node scripts/verify-sarif.mjs artifacts/vulnerable.sarif
          test "$EXPECT_FINDINGS" = "9"
          test "$EXPECT_CRITICAL" = "2"
          test "$EXPECT_HIGH" = "4"
          test "$EXPECT_MEDIUM" = "3"
          test "$EXPECT_LOW" = "0"
          test "$OUTPUT_SARIF_PATH" = "artifacts/vulnerable.sarif"
          test "$OUTPUT_JSON_PATH" = "artifacts/vulnerable.json"
          node -e 'const r = JSON.parse(require("node:fs").readFileSync(process.env.OUTPUT_JSON_PATH, "utf8")); if (r.findings.length !== 9 || r.agent_usages.length === 0 || r.diagnostics.length !== 1 || r.analysis_complete !== false || !r.findings.every((f) => f.id && f.rule_id)) process.exit(1)'
          test "$ANALYSIS_COMPLETE" = "false"
          test "$EXPECT_DIAGNOSTICS" = "1"

      - name: Action smoke - hardened
        id: hardened
        uses: ./
        with:
          path: examples/hardened
          sarif: artifacts/hardened.sarif
          json: artifacts/hardened.json
          fail-on: none

      - name: Verify hardened Action outputs
        env:
          EXPECT_FINDINGS: ${{ steps.hardened.outputs.findings }}
          EXPECT_CRITICAL: ${{ steps.hardened.outputs.critical }}
          EXPECT_HIGH: ${{ steps.hardened.outputs.high }}
          EXPECT_MEDIUM: ${{ steps.hardened.outputs.medium }}
          EXPECT_LOW: ${{ steps.hardened.outputs.low }}
          OUTPUT_SARIF_PATH: ${{ steps.hardened.outputs.sarif-path }}
          OUTPUT_JSON_PATH: ${{ steps.hardened.outputs.json-path }}
          ANALYSIS_COMPLETE: ${{ steps.hardened.outputs.analysis-complete }}
        run: |
          node scripts/verify-sarif-schema.mjs artifacts/hardened.sarif
          node scripts/verify-sarif.mjs artifacts/hardened.sarif
          test "$EXPECT_FINDINGS" = "0"
          test "$OUTPUT_SARIF_PATH" = "artifacts/hardened.sarif"
          test "$OUTPUT_JSON_PATH" = "artifacts/hardened.json"
          node -e 'const r = JSON.parse(require("node:fs").readFileSync(process.env.OUTPUT_JSON_PATH, "utf8")); if (r.findings.length !== 0 || r.agent_usages.length !== 0 || r.analysis_complete !== true) process.exit(1)'
          test "$ANALYSIS_COMPLETE" = "true"

      - name: Capture synthetic E3 Action inputs
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { existsSync, mkdirSync, readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import path from 'node:path';

          const root = 'corpus/adversarial/cases/local-reusable';
          const source = '.github/workflows/caller.yml';
          const output = 'artifacts/reusable.json';
          assert(!existsSync(output), 'Action JSON must be absent before the Action runs');
          const hash = (file) => createHash('sha256').update(readFileSync(file)).digest('hex');
          const workflows = readdirSync(path.join(root, '.github/workflows'), { withFileTypes: true })
            .filter((entry) => entry.isFile() && /\.ya?ml$/.test(entry.name))
            .map((entry) => `.github/workflows/${entry.name}`);
          const configs = ['agentci.config.json', '.agentcirc.json']
            .filter((file) => existsSync(path.join(root, file)));
          const input_files = [...workflows, ...configs].sort()
            .map((file) => ({ path: file, sha256: hash(path.join(root, file)) }));
          assert.deepEqual(workflows.sort(), [
            '.github/workflows/bridge.yml',
            '.github/workflows/caller.yml',
            '.github/workflows/reusable.yml',
          ]);
          assert.equal(configs.length, 0);
          mkdirSync('artifacts', { recursive: true });
          writeFileSync('artifacts/e3-reusable-preflight.json', JSON.stringify({
            case_id: 'synthetic-reusable', source_path: source, input_files,
            action_commit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            action_bundle_sha256: hash('dist/action.js'),
          }));
          NODE

      - name: Action smoke - reusable caller chain
        id: reusable
        uses: ./
        with:
          path: corpus/adversarial/cases/local-reusable
          sarif: artifacts/reusable.sarif
          json: artifacts/reusable.json
          fail-on: none

      - name: Verify reusable caller chain in Action JSON
        env:
          E3_ACTION_OUTCOME: ${{ steps.reusable.outcome }}
        run: |
          node -e 'const assert = require("node:assert/strict"); const r = JSON.parse(require("node:fs").readFileSync("artifacts/reusable.json", "utf8")); assert.deepEqual(r.agent_usages[0]?.call_chain, [".github/workflows/caller.yml#agent", ".github/workflows/bridge.yml#agent"]); assert(r.findings.some((f) => f.call_chain?.[0] === ".github/workflows/caller.yml#agent"))'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { loadActionRun, projectPrimary } from './scripts/benchmark/v4-primary-projection.mjs';

          const preflight = JSON.parse(readFileSync('artifacts/e3-reusable-preflight.json', 'utf8'));
          const source = preflight.source_path;
          const caseRecord = {
            case_id: preflight.case_id, source_path: source,
            sha256: preflight.input_files.find((file) => file.path === source).sha256,
          };
          const jsonPath = 'artifacts/reusable.json';
          const runReceipt = {
            case_id: preflight.case_id,
            source_path: source,
            action_commit: preflight.action_commit,
            input_files: preflight.input_files,
            output_sha256: createHash('sha256').update(readFileSync(jsonPath)).digest('hex'),
            outcome: process.env.E3_ACTION_OUTCOME,
            fail_on: 'none',
          };
          const { result, run_incomplete } = await loadActionRun({
            caseRecord,
            inputRoot: 'corpus/adversarial/cases/local-reusable',
            actionBundlePath: 'dist/action.js',
            expectedBundleSha256: preflight.action_bundle_sha256,
            expectedActionCommit: preflight.action_commit,
            jsonPath,
            outputRoot: 'artifacts',
            runReceipt,
          });
          assert.equal(run_incomplete, false);
          const row = (unit_id, scope, rule_id) => ({
            unit_id, case_id: caseRecord.case_id, source_path: source,
            scope, job_id: 'agent', step_index: null, rule_id,
          });
          const registryRows = [
            row('agent-usage', 'reusable-call', 'agentci/agent-usage'),
            row('prompt', 'reusable-call', 'agentci/untrusted-input-in-prompt'),
            row('shell', 'reusable-call', 'agentci/ai-shell-access'),
            row('gated-write', 'job', 'agentci/gated-ai-write-token'),
            row('broad-write', 'job', 'agentci/broad-write-permissions'),
          ];
          const expectedUnitIds = ['agent-usage', 'prompt', 'shell', 'gated-write', 'broad-write'];
          const projected = projectPrimary({ caseRecord, registryRows, expectedUnitIds, result });
          assert.deepEqual(projected.parse_gap_unit_ids, []);
          assert.deepEqual(projected.out_of_scope_records, []);
          assert.deepEqual(projected.units.map((unit) => [unit.unit_id, unit.alert, unit.matched_records]), [
            ['agent-usage', true, [{ kind: 'agent_usage', index: 0, id: '.github/workflows/reusable.yml:agent:0:.github/workflows/caller.yml#agent>.github/workflows/bridge.yml#agent' }]],
            ['prompt', true, [{ kind: 'finding', index: 0, id: 'agentci/untrusted-input-in-prompt:.github/workflows/reusable.yml:agent:0:.github/workflows/caller.yml#agent>.github/workflows/bridge.yml#agent' }]],
            ['shell', true, [{ kind: 'finding', index: 1, id: 'agentci/ai-shell-access:.github/workflows/reusable.yml:agent:0:.github/workflows/caller.yml#agent>.github/workflows/bridge.yml#agent' }]],
            ['gated-write', true, [{ kind: 'finding', index: 2, id: 'agentci/gated-ai-write-token:.github/workflows/reusable.yml:agent::.github/workflows/caller.yml#agent>.github/workflows/bridge.yml#agent' }]],
            ['broad-write', true, [{ kind: 'finding', index: 3, id: 'agentci/broad-write-permissions:.github/workflows/reusable.yml:agent::.github/workflows/caller.yml#agent>.github/workflows/bridge.yml#agent' }]],
          ]);
          NODE

      - name: Action smoke - JSON omitted
        id: no-json
        uses: ./
        with:
          path: examples/hardened
          sarif: artifacts/no-json.sarif
          fail-on: none

      - name: Verify omitted JSON stays unwritten
        env:
          OMITTED_JSON_PATH: ${{ steps.no-json.outputs.json-path }}
        run: |
          test -z "$OMITTED_JSON_PATH"
          test ! -e agentci-results.json

      - name: Action smoke - threshold failure
        id: threshold
        continue-on-error: true
        uses: ./
        with:
          path: examples/vulnerable
          sarif: artifacts/threshold.sarif
          json: artifacts/threshold.json
          fail-on: high

      - name: Verify Action threshold behavior
        if: always()
        env:
          EXPECT_FINDINGS: ${{ steps.threshold.outputs.findings }}
          EXPECT_CRITICAL: ${{ steps.threshold.outputs.critical }}
          EXPECT_HIGH: ${{ steps.threshold.outputs.high }}
          EXPECT_MEDIUM: ${{ steps.threshold.outputs.medium }}
          EXPECT_LOW: ${{ steps.threshold.outputs.low }}
          OUTPUT_JSON_PATH: ${{ steps.threshold.outputs.json-path }}
          STEP_OUTCOME: ${{ steps.threshold.outcome }}
        run: |
          test "$STEP_OUTCOME" = "failure"
          node scripts/verify-sarif-schema.mjs artifacts/threshold.sarif
          node scripts/verify-sarif.mjs artifacts/threshold.sarif
          test "$OUTPUT_JSON_PATH" = "artifacts/threshold.json"
          node -e 'const r = JSON.parse(require("node:fs").readFileSync(process.env.OUTPUT_JSON_PATH, "utf8")); if (r.findings.length !== 9 || !r.findings.every((f) => f.id)) process.exit(1)'
          test "$EXPECT_HIGH" -gt 0

      - name: CLI smoke
        run: node dist/cli.js scan examples/vulnerable --json --fail-on none

      - name: Package smoke test
        run: |
          npm pack --json --dry-run --ignore-scripts --foreground-scripts=false > artifacts/npm-pack.json
          node scripts/verify-package.mjs artifacts/npm-pack.json
          pnpm package:smoke

      - name: Verify frozen baseline and benchmark snapshot
        run: |
          pnpm baseline:verify
          pnpm benchmark:verify

      - name: Reproduction toolchain smoke test
        run: pnpm benchmark:smoke

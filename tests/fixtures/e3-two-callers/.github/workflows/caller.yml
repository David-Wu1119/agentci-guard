name: e3-two-callers
on: issue_comment
permissions:
  issues: write
jobs:
  agent:
    uses: ./.github/workflows/bridge.yml
    with:
      request: ${{ github.event.comment.body }}
      tools: "--allowedTools Bash(git:*)"
  second:
    uses: ./.github/workflows/bridge.yml
    with:
      request: ${{ github.event.comment.body }}
      tools: "--allowedTools Bash(git:*)"

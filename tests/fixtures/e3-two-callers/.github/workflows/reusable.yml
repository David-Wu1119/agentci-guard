name: e3-two-callers-callee
on:
  workflow_call:
    inputs:
      request:
        required: true
        type: string
      tools:
        required: true
        type: string
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc
        with:
          prompt: "Handle: ${{ inputs.request }}"
          claude_args: ${{ inputs.tools }}

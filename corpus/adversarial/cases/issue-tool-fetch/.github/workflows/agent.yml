on:
  issues:
    types: [labeled]
permissions:
  issues: write
  id-token: write
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Plan issue
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Read issue #${{ github.event.issue.number }} with gh issue view and post a plan."
          claude_args: '--allowedTools "Bash(gh issue view:*),Bash(gh issue comment:*)"'

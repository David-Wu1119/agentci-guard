name: trusted-comment-parent-tag
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
jobs:
  agent:
    if: github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc
